# Weekly update PRs for the pinned GitHub Actions (SHA pins go stale) and
# for Rust dependencies. CI runs the full suite, including cargo-deny, on each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
